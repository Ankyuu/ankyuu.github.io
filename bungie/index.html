<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion Ankyuu</title>
  <style>body{background:#0E1114;color:#ECEAE4;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px;text-align:center}</style>
</head>
<body>
  <p id="msg">Retour vers l'application…</p>
  <script>
    // Bungie renvoie ici après la connexion. On renvoie vers l'app
    // dont l'adresse est cachée dans le paramètre « state ».
    const params = new URLSearchParams(location.search);
    const state = params.get('state') || '';
    const code = params.get('code') || '';
    let target = '';
    try { target = JSON.parse(atob(state)).r || ''; } catch (e) {}
    // Retours autorisés : Expo Go, l'app installée, ou la version web sur GitHub Pages
    const allowed =
      /^(exp|exps|ankyuu):\/\//.test(target) ||
      target.startsWith('https://ankyuu.github.io/app/') ||
      /^http:\/\/localhost:\d+\//.test(target); // version web en développement sur ton PC
    if (code && allowed) {
      const sep = target.includes('?') ? '&' : '?';
      location.replace(target + sep + 'code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state));
    } else {
      document.getElementById('msg').textContent = 'Lien de connexion invalide. Retourne dans l’app et réessaie.';
    }
  </script>
</body>
</html>
